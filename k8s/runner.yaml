apiVersion: v1
kind: Namespace
metadata:
  name: argus-runner
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argus-runner
  namespace: argus-runner
---
# Only what the ops read; each new op adds its resource here. Never Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argus-runner-readonly
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argus-runner-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argus-runner-readonly
subjects:
  - kind: ServiceAccount
    name: argus-runner
    namespace: argus-runner
---
apiVersion: v1
kind: Secret
metadata:
  name: argus-runner-token
  namespace: argus-runner
type: Opaque
stringData:
  token: dev-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-runner
  namespace: argus-runner
  labels:
    app: argus-runner
spec:
  replicas: 1
  # Two pods with one token would keep replacing each other's connection.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: argus-runner
  template:
    metadata:
      labels:
        app: argus-runner
    spec:
      serviceAccountName: argus-runner
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: argus-sre-runner:dev
          # Built inside minikube (minikube image build), not in a registry.
          imagePullPolicy: Never
          env:
            - name: GATEWAY_URL
              value: http://host.minikube.internal:8080
            - name: CLUSTER_NAME
              value: minikube
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: argus-runner-token
                  key: token
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
